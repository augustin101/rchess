[package]
name = "rchess"
version = "0.1.0"
edition = "2024"
default-run = "rchess"

[[bin]]
name = "rchess"
path = "src/main.rs"

[[bin]]
name = "rchess-uci"
path = "src/bin/rchess_uci.rs"

[lib]
name = "rchess"
path = "src/lib.rs"

[features]
# Embed the NNUE binary configured in engine.toml at compile time.
# The match script uses this so the binary is fully self-contained.
# Usage: cargo build --features embed-nnue
embed-nnue = []

[dependencies]
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# embed_nnue is a custom cfg emitted by build.rs — tell rustc it is expected.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(embed_nnue)'] }
