[package]
name = "rchess"
version = "0.1.0"
edition = "2024"
default-run = "rchess"

[[bin]]
name = "rchess"
path = "src/main.rs"

[[bin]]
name = "rchess-uci"
path = "src/bin/rchess_uci.rs"

[lib]
name = "rchess"
path = "src/lib.rs"

[features]
# Embed the configured NNUE binary at compile time (no file needed at runtime).
# Usage: cargo build --features embed-nnue
embed-nnue = []

[dependencies]
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# embed_nnue is emitted by build.rs when the embed-nnue feature is active.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(embed_nnue)'] }
