[package]
name = "rchess"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rchess"
path = "src/main.rs"

[[bin]]
name = "rchess-uci"
path = "src/bin/rchess_uci.rs"

[lib]
name = "rchess"
path = "src/lib.rs"

[dependencies]
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
