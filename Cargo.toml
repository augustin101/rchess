[package]
name = "rchess"
version = "0.1.0"
edition = "2024"
default-run = "rchess"

[[bin]]
name = "rchess"
path = "src/main.rs"

[[bin]]
name = "rchess-uci"
path = "src/bin/rchess_uci.rs"

[lib]
name = "rchess"
path = "src/lib.rs"

[dependencies]
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# opt-in cfg flag for compile-time NNUE embedding (see src/engine/nnue.rs)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(embed_nnue)'] }
